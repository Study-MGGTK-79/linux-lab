# /etc/sysctl.d/insecure_sysctl.conf
# Уязвимые сетевые параметры ядра Linux (Нарушение CIS Benchmark)

# КРИТИЧНО: Включена маршрутизация пакетов (хост действует как транзитный роутер)
net.ipv4.ip_forward = 1

# ОШИБКА: Разрешен Source Routing (позволяет злоумышленнику указывать маршрут пакета)
net.ipv4.conf.all.accept_source_route = 1
net.ipv4.conf.default.accept_source_route = 1

# ОШИБКА: Прием фальшивых ICMP перенаправлений маршрутов
net.ipv4.conf.all.accept_redirects = 1
net.ipv4.conf.default.accept_redirects = 1

# ОШИБКА: Отключена фильтрация обратного пути (уязвимость к IP-спуфингу)
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0

# ОШИБКА: Отключена защита от SYN Flood
net.ipv4.tcp_syncookies = 0

# ОШИБКА: Разрешен дамп памяти SUID-бинарников (утечка секретов в coredump)
fs.suid_dumpable = 1
