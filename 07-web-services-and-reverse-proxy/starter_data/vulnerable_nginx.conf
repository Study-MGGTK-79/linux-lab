# ==============================================================================
# УЯЗВИМАЯ КОНФИГУРАЦИЯ NGINX ДЛЯ ЛАБОРАТОРНОГО МОДУЛЯ 07
# Web Infrastructure Exploitation, Nginx Misconfigurations & SSL Hardening
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # ПРИМЕЧАНИЕ: Намеренно включен показ версии сервера (уязвимость раскрытия баннера)
    server_tokens on;

    # Логирование
    access_log /tmp/nginx_vulnerable_access.log;
    error_log  /tmp/nginx_vulnerable_error.log;

    # ==========================================================================
    # Виртуальный хост 1 (HTTP: порт 8080)
    # Содержит уязвимости Alias Traversal, IP Spoofing, отсутствие Rate Limit и Headers
    # ==========================================================================
    server {
        listen 8080 default_server;
        server_name portal.lab.local localhost;

        # ----------------------------------------------------------------------
        # УЯЗВИМОСТЬ 1: ALIAS TRAVERSAL (OFF-BY-SLASH)
        # В директиве location отсутствует замыкающий слэш!
        # При запросе /static../config.py Nginx отсекает /static и соединяет ../config.py
        # с путем /tmp/college_linux_lab7/www/static/, раскрывая конфиги приложения!
        # ----------------------------------------------------------------------
        location /static {
            alias /tmp/college_linux_lab7/www/static/;
            autoindex on;
        }

        # ----------------------------------------------------------------------
        # УЯЗВИМОСТЬ 2: СПУФИНГ X-FORWARDED-FOR И ОБХОД IP-WHITELIST
        # Nginx слепо доверяет клиентскому заголовку $http_x_forwarded_for,
        # что позволяет атакующему представиться доверенным адресом 127.0.0.1
        # ----------------------------------------------------------------------
        location /admin {
            proxy_pass http://127.0.0.1:8081/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # УЯЗВИМОСТЬ 3: ОТСУТСТВИЕ RATE LIMITING НА КРИТИЧЕСКИХ ЭНДПОИНТАХ
        # Допускает брутфорс паролей и DoS-атаки
        # ----------------------------------------------------------------------
        location /api/login {
            proxy_pass http://127.0.0.1:8081/api/login;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8081/api/;
            proxy_set_header Host $host;
        }

        # Отсутствуют HTTP Security Headers (нет CSP, X-Frame-Options, X-Content-Type-Options)
        location / {
            root /tmp/college_linux_lab7/www;
            index index.html;
        }
    }

    # ==========================================================================
    # Виртуальный хост 2 (HTTPS: порт 8443)
    # Содержит уязвимости устаревшего криптографического стека TLS
    # ==========================================================================
    server {
        listen 8443 ssl;
        server_name secure.lab.local localhost;

        # Сертификаты
        ssl_certificate     /Users/kodoku/Documents/College/Linux/07-web-services-and-reverse-proxy/starter_data/ssl/server.crt;
        ssl_certificate_key /Users/kodoku/Documents/College/Linux/07-web-services-and-reverse-proxy/starter_data/ssl/server.key;

        # ----------------------------------------------------------------------
        # УЯЗВИМОСТЬ 4: УСТАРЕВШИЕ ПРОТОКОЛЫ И СЛАБЫЕ ШИФРЫ (POODLE / BEAST / NO PFS)
        # Разрешены небезопасные протоколы TLS 1.0 и TLS 1.1, устаревшие шифры CBC
        # ----------------------------------------------------------------------
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'RC4-SHA:RC4-MD5:DES-CBC3-SHA:AES128-SHA:AES256-SHA';
        ssl_prefer_server_ciphers on;

        # Отсутствует HSTS (Strict-Transport-Security)
        # Включены небезопасные сессионные билеты
        ssl_session_tickets on;

        location / {
            return 200 '{"status":"connected_over_insecure_legacy_tls","protocol":"$ssl_protocol","cipher":"$ssl_cipher"}\n';
            default_type application/json;
        }
    }
}
