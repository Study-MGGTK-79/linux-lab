# ==============================================================================
# ПОВРЕЖДЕННАЯ КОНФИГУРАЦИЯ NGINX (ДЛЯ ЛАБОРАТОРНОЙ РАБОТЫ 7.1)
# ВНИМАНИЕ: Данный файл содержит синтаксические, структурные и логические ошибки.
# Задача инженера — локализовать и устранить их все с помощью 'nginx -t' и анализа логов.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ОШИБКА 1: Синтаксическая ошибка в определении upstream (знак '=' недопустим)
    upstream broken_cluster {
        server = 127.0.0.1:8081 weight=2;
        server 127.0.0.1:8082
        # ОШИБКА 2: Пропущена точка с запятой ';' на строке выше
    }

    # Виртуальный хост 1: Основной портал
    server {
        listen 80 default_server;
        # ОШИБКА 3: Пропущена точка с запятой в server_name
        server_name portal.lab.local www.portal.lab.local

        # ОШИБКА 4: proxy_pass указан напрямую в контексте server, а не в location!
        proxy_pass http://broken_cluster;

        location / {
            root /var/www/html;
            index index.html;
            
            # ОШИБКА 5: Зацикленный rewrite (вызовет ошибку 500: rewrite or internal redirection cycle)
            rewrite ^(.*)$ /index.html;
        }

        # ОШИБКА 6: Не закрыта фигурная скобка блока location /api
        location /api/ {
            proxy_pass http://broken_cluster/;
            proxy_set_header Host $http_host
            proxy_set_header X-Real-IP $remote_addr;
            # Пропущена закрывающая скобка '}'
    }

    # Виртуальный хост 2: Конфликт default_server и SSL
    server {
        # ОШИБКА 7: Дублирование default_server на том же IP:порту (конфликт с первым сервером)
        listen 80 default_server;
        server_name api.lab.local;

        location / {
            proxy_pass http://127.0.0.1:8081;
        }
    }

    # Виртуальный хост 3: Некорректная конфигурация SSL
    server {
        listen 443 ssl;
        server_name secure.lab.local;

        # ОШИБКА 8: Использование устаревшего и запрещенного протокола SSLv3
        ssl_protocols SSLv3 TLSv1 TLSv1.1;

        # ОШИБКА 9: Опечатка в директиве ssl_certificate_key
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_cert_key /etc/nginx/ssl/server.key;

        location / {
            return 200 "HTTPS OK\n";
        }
    }
}
