# Configuration for Mock Enterprise Database (MockDB v14.2)
listen_addresses = '0.0.0.0'
port = 5432
max_connections = 250
shared_buffers = 512MB
work_mem = 16MB
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'test ! -f /mnt/backup/%f && cp %p /mnt/backup/%f'
data_directory = '/var/lib/mock_db/data'
